<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RealmDom — Forest Realm prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(14,22,17,.92);--edge:rgba(214,190,128,.35);--gold:#e8c66a;--ink:#f1ead6;--quiet:#b9b29c;--bad:#ff6b6b;--good:#7be08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1510;color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;user-select:none;-webkit-user-select:none}
canvas#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas#map3d{position:fixed;inset:0;width:100%;height:100%;display:none}
.title{font-family:Cinzel,serif;letter-spacing:.04em}
button{font:inherit;color:var(--ink);background:rgba(232,198,106,.12);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(#e8c66a,#c9a24a);color:#1b1408;border:none;font-weight:700}
button.danger{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.5)}
button:disabled{opacity:.45}
#hud{position:fixed;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:7px 10px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
#who{flex:1;min-width:0;overflow:hidden}
#who .nm{overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#modeBtn{padding:7px 10px;font-size:13px;font-weight:700;border-radius:14px}
#modeBtn.alert{background:rgba(255,180,60,.2);border-color:#ffb43c}
#modeBtn.shield{background:rgba(90,170,255,.18);border-color:#5aaaff}
#banner{position:fixed;left:8px;right:8px;top:54px;z-index:4;display:none}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.card .tx{flex:1;font-size:13.5px;line-height:1.35}
.card.vehicle{border-color:var(--bad);background:rgba(60,14,14,.92)}
#raidbar{position:fixed;left:8px;right:8px;top:54px;z-index:4;display:none}
#quest{position:fixed;left:8px;right:64px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;display:none}
#quest .card{padding:7px 10px;border-color:var(--gold);gap:8px}
#quest .card button{padding:7px 10px;font-size:13px;flex:none}
.rules{margin:10px 0 0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(214,190,128,.12);font-size:14px;line-height:1.4}
.rules li span:first-child{font-size:20px;flex:none;width:26px;text-align:center}
#toasts{position:fixed;left:8px;right:64px;bottom:calc(128px + env(safe-area-inset-bottom));z-index:35;display:flex;flex-direction:column;gap:6px;max-width:420px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.35;animation:tin .25s ease}
.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}.toast.gold{border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#bottom{position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:5;align-items:flex-end}
#bottom{pointer-events:none}
#bottom>*{pointer-events:auto}
#bottom .grow{flex:1;pointer-events:none}
#bottom button{background:var(--panel);font-size:13px;font-weight:600;padding:10px 12px}
#zoom{display:flex;flex-direction:column;gap:6px}
#zoom button{width:44px;height:40px;padding:0;font-size:18px}
#recenter{display:none}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(5,9,6,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,520px);max-height:88vh;overflow:auto;background:linear-gradient(#18241b,#101812);border:1px solid var(--edge);border-bottom:none;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sin .25s ease}
@keyframes sin{from{transform:translateY(30px);opacity:.4}}
.sheet h2{margin:0 0 4px;font-family:Cinzel,serif;font-size:21px;color:var(--gold)}
.sheet p{margin:6px 0;color:var(--quiet);line-height:1.45;font-size:14px}
.row{display:flex;gap:8px;margin-top:12px}
.row>button{flex:1}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(214,190,128,.12);font-size:14px}
.kv span:first-child{color:var(--quiet)}
#screen{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 20%,#24432a 0%,#0d1510 70%);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.signup{width:min(100%,420px)}
.logo{font-family:Cinzel,serif;font-size:42px;text-align:center;color:var(--gold);text-shadow:0 0 24px rgba(232,198,106,.4);margin-bottom:2px}
.tag{text-align:center;color:var(--quiet);margin-bottom:22px}
.signin{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;padding:13px}
.signin.apple{background:#f5f5f5;color:#111;border:none}
.signin.google{background:#fff;color:#222;border:none}
input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.35);color:var(--ink)}
label{font-size:13px;color:var(--quiet);display:block;margin:12px 0 6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fcard{border:2px solid transparent;background:rgba(0,0,0,.3);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.fcard.sel{border-color:var(--gold);background:rgba(232,198,106,.1)}
.fcard b{display:block;margin:6px 0 2px}
.fcard small{color:var(--quiet);font-size:12px}
.note{font-size:12px;color:var(--quiet);margin-top:10px;line-height:1.4}
#studio{position:fixed;inset:0;z-index:26;background:#0d1510;display:none;flex-direction:column}
#studio canvas{flex:1;width:100%;min-height:0;touch-action:none;display:block}
.stbar{display:flex;align-items:center;gap:8px;padding:10px 10px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--edge)}
.stbar .grow{flex:1;min-width:0}
.stbot{background:var(--panel);border-top:1px solid var(--edge);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.pal{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.sw2{flex:none;width:58px;border-radius:12px;border:2px solid transparent;background:rgba(0,0,0,.35);padding:6px 4px;text-align:center;font-size:11px;color:var(--quiet);cursor:pointer}
.sw2.sel{border-color:var(--gold);color:var(--ink)}
.sw2 i{display:block;width:30px;height:30px;margin:0 auto 4px;border-radius:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.tools{display:flex;gap:6px}
.tools button{flex:1;padding:9px 6px;font-size:13px}
.tools button.on{background:linear-gradient(#e8c66a,#c9a24a);color:#1b1408;border:none;font-weight:700}
#duel{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at 50% 30%,#1f3524,#070b08 75%);display:none;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
.dhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--quiet)}
.vs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.fighter{flex:1;text-align:center}
.fighter .nm{font-weight:700;font-size:15px}
.fighter .sc{font-family:Cinzel,serif;font-size:34px;color:var(--gold)}
.vsx{font-family:Cinzel,serif;color:var(--quiet)}
.arena{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;min-height:0}
.qtext{font-size:19px;font-weight:600;text-align:center;margin-bottom:18px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{padding:14px;text-align:left;font-size:16px;border-radius:14px;background:rgba(255,255,255,.05)}
.opt.right{border-color:var(--good);background:rgba(123,224,138,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.15)}
.timer{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.ai-note{text-align:center;color:var(--quiet);font-size:13px;min-height:20px;margin-top:12px}
.rune{position:absolute;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle,#ffe9a8,#e8a63a 60%,rgba(232,166,58,0) 72%);animation:pop .15s ease;cursor:pointer}
@keyframes pop{from{transform:scale(.4)}}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:0 auto;width:100%}
.mem button{height:110px;font-size:40px;border-radius:18px;background:rgba(255,255,255,.06)}
.mem button.lit{background:rgba(232,198,106,.55);box-shadow:0 0 24px rgba(232,198,106,.6)}
.big{font-family:Cinzel,serif;font-size:34px;text-align:center;color:var(--gold);margin:10px 0}
.center{text-align:center}
.pack{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--edge);border-radius:14px;background:rgba(0,0,0,.25)}
.pack b{font-size:15px}.pack small{color:var(--quiet)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(214,190,128,.12)}
.sw{width:50px;height:30px;border-radius:15px;background:#333;position:relative;border:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#ddd;transition:left .2s}
.sw.on{background:var(--gold)}.sw.on::after{left:23px}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="chip" id="who"><span class="dot" id="whoDot"></span><span class="nm" id="whoName">—</span></div>
  <div class="chip" title="Coins">🪙 <span id="coins">0</span></div>
  <div class="chip" title="Rank points">⚔️ <span id="rank">0</span></div>

</div>

  <button id="storeBtn">🏹 Store</button>
  <button id="realmBtn">🌲 Realm</button>

  <div class="grow"></div>
  <div id="zoom"><button id="viewBtn" title="Switch 2D / 3D" style="font-size:14px;font-weight:700">3D</button><button id="homeBtn" title="Back to my real position" style="display:none">📍</button><button id="recenter" title="Recenter">◎</button><button id="zin">+</button><button id="zout">−</button></div>
</div>
<div id="duel"></div>
<div id="studio"></div>
<div id="screen"></div>

<script>
'use strict';
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng = mulberry32(20261031);
const R = () => rng();
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = {
  get(k){try{return JSON.parse(localStorage.getItem('realmdom.' + k))}catch(e){return null}},
  set(k, v){try{localStorage.setItem('realmdom.' + k, JSON.stringify(v))}catch(e){}}
};
function esc(s){return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- game data ---------- */
const FACTIONS = [
  {id:'verdant', name:'Verdant Circle', color:'#5fd16a', motto:'Grow, heal, endure', icon:'🌿'},
  {id:'ember',   name:'Ember Court',    color:'#ff7a3d', motto:'Strike first, burn bright', icon:'🔥'},
  {id:'tide',    name:'Tide Wardens',   color:'#3fb6ff', motto:'Patience wins wars', icon:'🌊'},
  {id:'veil',    name:'Night Veil',     color:'#b07cff', motto:'Unseen, unstoppable', icon:'🌙'}
];
const FAC = id => FACTIONS.find(f => f.id === id);
const AI_NAMES = ['Kael','Mira','Thorne','Lyra','Bram','Seren','Oren','Isolde','Fenn','Nyx','Rowan','Ash','Talia','Corin','Wren','Eamon','Sable','Juno','Ilya','Vesper'];
const NAME_A = ['Swift','Silent','Amber','Iron','Moss','Storm','Pale','Wild','Ember','Frost','Shadow','Bright'];
const NAME_B = ['Fox','Warden','Rook','Hawk','Thorn','Wolf','Sage','Ranger','Moth','Viper','Stag','Owl'];
const LM_A = ['Mossy','Elder','Whispering','Sunken','Silver','Hollow','Thorn','Amber','Misty','Ancient','Glimmer','Old'];
const LM_B = ['Shrine','Fountain','Oak','Stone Circle','Well','Watchtower','Gate','Grove','Altar','Bridge','Monolith','Spring'];
const QUIZ = [
  ['Which planet is known as the Red Planet?', ['Mars','Venus','Jupiter','Mercury'], 0],
  ['How many continents are there on Earth?', ['5','6','7','8'], 2],
  ['What gas do plants absorb from the air?', ['Oxygen','Carbon dioxide','Nitrogen','Helium'], 1],
  ['What is the largest ocean on Earth?', ['Atlantic','Indian','Arctic','Pacific'], 3],
  ['How many legs does a spider have?', ['6','8','10','12'], 1],
  ['What is the chemical symbol for gold?', ['Gd','Go','Au','Ag'], 2],
  ['Which is the longest river in Africa?', ['Congo','Niger','Zambezi','Nile'], 3],
  ['What is the hardest natural substance?', ['Quartz','Diamond','Iron','Granite'], 1],
  ['Which animal is the tallest in the world?', ['Elephant','Giraffe','Camel','Moose'], 1],
  ['How many minutes are in a full day?', ['1,240','1,440','1,640','1,840'], 1],
  ['What is the capital of Japan?', ['Kyoto','Osaka','Tokyo','Nagoya'], 2],
  ['What do bees collect to make honey?', ['Pollen','Nectar','Sap','Dew'], 1],
  ['Which is the smallest prime number?', ['0','1','2','3'], 2],
  ['What is 9 × 7?', ['56','63','72','67'], 1],
  ['What is frozen water called?', ['Steam','Ice','Mist','Frost'], 1],
  ['Which tree produces acorns?', ['Pine','Maple','Oak','Birch'], 2],
  ['Which bird is a symbol of wisdom in many tales?', ['Crow','Owl','Eagle','Swan'], 1],
  ['How many sides does a hexagon have?', ['5','6','7','8'], 1],
  ['What is the closest star to Earth?', ['Sirius','Polaris','The Sun','Alpha Centauri'], 2],
  ['Which metal is liquid at room temperature?', ['Mercury','Lead','Tin','Zinc'], 0],
  ['What is the largest mammal?', ['Elephant','Blue whale','Orca','Hippo'], 1],
  ['In which country are the pyramids of Giza?', ['Mexico','Peru','Egypt','Sudan'], 2],
  ['What is 15% of 200?', ['15','20','30','35'], 2],
  ['Which organ pumps blood through the body?', ['Lungs','Liver','Heart','Kidney'], 2],
  ['Which color do you get by mixing blue and yellow?', ['Purple','Green','Orange','Brown'], 1],
  ['How many players are on a soccer team on the field?', ['9','10','11','12'], 2],
  ['What is the boiling point of water at sea level?', ['90 °C','100 °C','110 °C','120 °C'], 1],
  ['Which is the largest desert in the world, including polar?', ['Sahara','Gobi','Antarctic','Arabian'], 2],
  ['What do caterpillars turn into?', ['Beetles','Moths or butterflies','Bees','Dragonflies'], 1],
  ['Which instrument has 88 keys?', ['Organ','Accordion','Piano','Harpsichord'], 2],
  ['What is the square root of 144?', ['11','12','13','14'], 1],
  ['Which planet has the most famous rings?', ['Saturn','Mars','Earth','Mercury'], 0],
  ['How many hours are in a week?', ['148','158','168','178'], 2],
  ['Which sea creature has three hearts?', ['Shark','Octopus','Dolphin','Crab'], 1],
  ['Which language has the most native speakers?', ['English','Spanish','Mandarin Chinese','Hindi'], 2],
  ['What is the main ingredient of hummus?', ['Lentils','Chickpeas','Beans','Peas'], 1]
];
const REALMS = {
  forest:  {name:'Forest Realm',  icon:'🌲', featured:'quiz',   lmA:LM_A, lmB:LM_B, enemies:['Blight spirit','Shadow wolf'], blurb:'Paths, woods and glades. Riddles rule here.'},
  cyber:   {name:'Cyber Realm',   icon:'💠', featured:'runes',  lmA:['Neon','Ghost','Quantum','Static','Chrome','Signal','Null','Hex'], lmB:['Node','Relay','Core','Terminal','Spire','Hub','Gateway','Array'], enemies:['Rogue AI','Virus swarm'], blurb:'Neon lanes and glowing towers. Reflexes rule here.'},
  kingdom: {name:'Kingdom Realm', icon:'🏰', featured:'memory', lmA:['Royal','Old','Iron','Golden','Kings','Stone','High','Crown'], lmB:['Keep','Tower','Gate','Bastion','Hall','Bridge','Citadel','Market'], enemies:['Raider band','Young dragon'], blurb:'Castles and cobbled roads. Memory rules here.'}
};
const WEAPONS = [
  {id:'bow',    name:'Hunting Bow',   icon:'🏹', power:12, rate:.40, price:0,    rank:0},
  {id:'xbow',   name:'Iron Crossbow', icon:'🎯', power:22, rate:.55, price:300,  rank:20},
  {id:'staff',  name:'Ember Staff',   icon:'🔥', power:35, rate:.50, price:900,  rank:80},
  {id:'cannon', name:'Storm Cannon',  icon:'⚡', power:60, rate:.80, price:2500, rank:200}
];
const W_OF = id => WEAPONS.find(w => w.id === id);
const STRUCTS = {
  tower:     {name:'Watchtower', icon:'🗼', cost:150, desc:'Raids on this land are announced 30 s earlier.'},
  mint:      {name:'Mint',       icon:'💰', cost:200, desc:'+1 🪙 every 10 s from this land (split by share).'},
  wall:      {name:'Wall',       icon:'🧱', cost:200, desc:'Raiders here need 10 less force to beat; rivals need 10 more to take it.'},
  barracks:  {name:'Barracks',   icon:'🏕️', cost:300, desc:'2 garrison fighters join you in battles defending this land.'},
  wardstone: {name:'Ward Stone', icon:'💎', cost:350, desc:'Automatically blocks one raid on this land every 10 minutes.'}
};
const MATS = {
  wood:    {name:'Wood',    color:'#a0703c', price:1},
  stone:   {name:'Stone',   color:'#8a8f96', price:2},
  moss:    {name:'Moss',    color:'#4f8a3a', price:1},
  brick:   {name:'Brick',   color:'#b5523b', price:3},
  marble:  {name:'Marble',  color:'#e9e4da', price:4},
  glass:   {name:'Glass',   color:'#9fd8f0', price:4, glass:true},
  lantern: {name:'Lantern', color:'#ffd27a', price:8, glow:true},
  gold:    {name:'Gold',    color:'#e8c14a', price:12},
  crystal: {name:'Crystal', color:'#a66bff', price:15, glow:true}
};
const PLOT = 16, PLOT_H = 12;
const prestigeOf = l => l.creation ? Object.values(l.creation.blocks).reduce((t, m) => t + MATS[m].price, 0) : 0;
const prestigeBonus = l => Math.min(5, Math.floor(prestigeOf(l)/100));
const has = (l, k) => !!(l.builds && l.builds.includes(k));
const slotsOf = l => l.fortress ? 5 : 3;
const BOSSES = {forest:'Blight Colossus', cyber:'The Overmind', kingdom:'Ancient Dragon'};
const GAMES = [
  {id:'quiz', name:'Riddle Clash', icon:'📜', desc:'3 questions, 8 seconds each'},
  {id:'runes', name:'Rune Strike', icon:'✨', desc:'Tap the runes before they fade'},
  {id:'memory', name:'Spirit Echo', icon:'🌀', desc:'Repeat the spirit sequence'}
];

/* ---------- state ---------- */
const S = {
  player: null, mode: 'alert', modeCooldown: 0, vehicle: false, simDriving: false,
  world: null, worldKind: 'demo', landmarks: [], agents: [], enemies: [], raid: null, nextRaidIn: 50,
  cam: {x:0, y:0, zoom:1.8, free:false}, busy:false, t:0, gps:null, heldNotices:[],
  cooldowns: new Map(), incomeT: 0, aiT: 0, challengeT: 12, 
  realm: 'forest', realms: {}, invites: [], portalCD: 0, inviteT: 40,
  qi: 0, questOff: false, stats: {kills:0, teamups:0, shield:false, wards:0, armory:false, realmOpened:false, fortress:0}
};

/* ---------- world: projection & building ---------- */
function bboxOf(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}return[a,b,c,d]}
function pip(x, y, pts){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins}return ins}
function centroid(pts){let x=0,y=0;for(const p of pts){x+=p[0];y+=p[1]}return[x/pts.length,y/pts.length]}

function finishWorld(w){
  w.trees = new Map(); w.flowers = [];
  let count = 0;
  const addTree = (x, y, r) => {const k = Math.floor(x/60)+','+Math.floor(y/60);if(!w.trees.has(k))w.trees.set(k,[]);w.trees.get(k).push({x,y,r,s:Math.floor(R()*4)});count++};
  for(const a of w.areas){
    a.bb = bboxOf(a.pts);
    if(a.kind === 'building' && count < 6000){
      const [x0,y0,x1,y1] = a.bb, step = 8;
      let placed = 0;
      for(let x = x0 + 2; x < x1; x += step) for(let y = y0 + 2; y < y1; y += step){
        const jx = x + (R()-.5)*3.5, jy = y + (R()-.5)*3.5;
        if(pip(jx, jy, a.pts)){addTree(jx, jy, 3.2 + R()*2.4); placed++}
      }
      if(!placed){const c = centroid(a.pts); addTree(c[0], c[1], 3)}
    }
    if(a.kind === 'park'){
      const [x0,y0,x1,y1] = a.bb, n = Math.min(60, ((x1-x0)*(y1-y0))/120);
      for(let i=0;i<n;i++){const x=x0+R()*(x1-x0),y=y0+R()*(y1-y0);if(pip(x,y,a.pts)){if(R()<.18)addTree(x,y,3+R()*2.5);else w.flowers.push({x,y,c:pick(['#f3d36b','#f28fb3','#ffffff','#b9a6ff'])})}}
    }
  }
  for(const l of w.lines) l.bb = bboxOf(l.pts);
  return w;
}

function genDemoWorld(){
  rng = mulberry32(777);
  const size = 520, w = {lines:[], areas:[], landmarkSpots:[], spawn:[0,0]};
  const xs = [], ys = [];
  for(let x = -size; x <= size; x += 95 + Math.floor(R()*35)) xs.push(x);
  for(let y = -size; y <= size; y += 95 + Math.floor(R()*35)) ys.push(y);
  const riverY = x => 150 + Math.sin(x/170)*60 + Math.sin(x/53)*12;
  const jit = (i) => (R()-.5)*14;
  const xj = xs.map(()=>[]), yj = ys.map(()=>[]);
  xs.forEach((x,i)=>{const pts=[];for(let y=-size;y<=size;y+=65)pts.push([x+jit(i),y]);xj[i]=pts;w.lines.push({kind:'road',w:i%3===1?9:5.5,pts})});
  ys.forEach((y,i)=>{const pts=[];for(let x=-size;x<=size;x+=65)pts.push([x,y+jit(i)]);yj[i]=pts;w.lines.push({kind:'road',w:i%3===1?9:5.5,pts})});
  const river=[];for(let x=-size-20;x<=size+20;x+=20)river.push([x,riverY(x)]);
  w.lines.push({kind:'river',w:26,pts:river});
  for(let i=0;i<xs.length-1;i++) for(let j=0;j<ys.length-1;j++){
    const x0=xs[i]+9,x1=xs[i+1]-9,y0=ys[j]+9,y1=ys[j+1]-9, cx=(x0+x1)/2, cy=(y0+y1)/2;
    const nearRiver = Math.abs(cy - riverY(cx)) < (y1-y0)/2 + 18;
    if(nearRiver || R() < .17){
      w.areas.push({kind:'park',pts:[[x0,y0],[x1,y0],[x1,y1],[x0,y1]]});
      if(!nearRiver) w.landmarkSpots.push([cx,cy]);
      continue;
    }
    const lotsX = 1 + Math.floor(R()*2), lotsY = 1 + Math.floor(R()*2);
    const dx=(x1-x0)/lotsX, dy=(y1-y0)/lotsY;
    for(let a=0;a<lotsX;a++)for(let b=0;b<lotsY;b++){
      const lx=x0+a*dx+2.5, ly=y0+b*dy+2.5, rx=x0+(a+1)*dx-2.5, ry=y0+(b+1)*dy-2.5;
      w.areas.push({kind:'building',pts:[[lx,ly],[rx,ly],[rx,ry],[lx,ry]]});
    }
  }
  // intersections as extra landmark spots
  for(let k=0;k<10;k++){const i=1+Math.floor(R()*(xs.length-2)),j=1+Math.floor(R()*(ys.length-2));w.landmarkSpots.push([xs[i],ys[j]])}
  w.spawn = [xs[Math.floor(xs.length/2)], ys[Math.floor(ys.length/2)]];
  rng = mulberry32(Date.now() & 0xffff);
  return finishWorld(w);
}

async function genOsmWorld(lat, lon, lat0 = lat, lon0 = lon, onStatus = null){
  const r = 450;
  const q = `[out:json][timeout:25];(way["highway"](around:${r},${lat},${lon});way["building"](around:${r},${lat},${lon});way["leisure"~"park|garden"](around:${r+150},${lat},${lon});way["landuse"~"grass|forest|recreation_ground|meadow|village_green"](around:${r+150},${lat},${lon});way["natural"~"water|wood"](around:${r+150},${lat},${lon});way["waterway"](around:${r+150},${lat},${lon});node["amenity"="fountain"](around:${r},${lat},${lon});node["tourism"~"artwork|viewpoint|attraction"](around:${r},${lat},${lon});node["historic"](around:${r},${lat},${lon}););out geom;`;
  const servers = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
  let js = null, lastErr = 'no response';
  for(const url of servers){
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
    try{
      if(onStatus) onStatus(`Loading your streets from ${new URL(url).host}…`);
      const res = await fetch(url, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:ctl.signal});
      if(!res.ok){ lastErr = `${new URL(url).host} answered ${res.status}${res.status === 429 ? ' (too busy)' : res.status === 504 ? ' (timed out)' : ''}`; continue; }
      js = await res.json(); break;
    }catch(e){ lastErr = `${new URL(url).host}: ${e.name === 'AbortError' ? 'timed out' : e.message}`; }
    finally{ clearTimeout(timer); }
  }
  if(!js) throw new Error(lastErr);
  const k = Math.cos(lat0*Math.PI/180)*111320;
  const P = (la, lo) => [(lo-lon0)*k, -(la-lat0)*110540];
  const w = {lines:[], areas:[], landmarkSpots:[], spawn:P(lat, lon), named:[]};
  let buildings = 0;
  for(const e of js.elements){
    const t = e.tags || {};
    if(e.type === 'node'){ w.landmarkSpots.push(P(e.lat, e.lon)); if(t.name) w.named.push({p:P(e.lat,e.lon), name:t.name}); continue; }
    if(!e.geometry) continue;
    const pts = e.geometry.map(g => P(g.lat, g.lon));
    if(t.highway){
      const big = /primary|secondary|tertiary|trunk/.test(t.highway), small = /footway|path|cycleway|steps|track|service/.test(t.highway);
      w.lines.push({kind:'road', w: big ? 10 : small ? 3 : 6, pts});
    } else if(t.building && buildings < 3000 && pts.length > 2){ w.areas.push({kind:'building', pts}); buildings++; }
    else if((t.leisure || t.landuse || t.natural === 'wood') && pts.length > 2){
      w.areas.push({kind:'park', pts});
      if(t.leisure === 'park'){ const c = centroid(pts); w.landmarkSpots.push(c); if(t.name) w.named.push({p:c, name:t.name}); }
    }
    else if(t.natural === 'water' && pts.length > 2) w.areas.push({kind:'water', pts});
    else if(t.waterway) w.lines.push({kind:'river', w: t.waterway === 'river' ? 22 : 6, pts});
  }
  if(w.landmarkSpots.length < 8){
    const roads = w.lines.filter(l => l.kind === 'road');
    for(let i = 0; i < 12 && roads.length; i++){ const l = pick(roads); w.landmarkSpots.push(pick(l.pts)); }
  }
  return finishWorld(w);
}

/* ---------- entities ---------- */
function makeLandmarks(w, realm){
  const spots = [...w.landmarkSpots].sort(() => Math.random() - .5), out = [], R2 = REALMS[realm];
  const [sx, sy] = w.spawn;
  // tutorial landmark close to spawn (Forest), a free welcome spot in other realms
  out.push({x:sx + 55, y:sy - 35, name: realm === 'forest' ? 'Sprout Shrine' : realm === 'cyber' ? 'Welcome Node' : 'Gatehouse', owner:null, fac:null, ward:0, corrupted:false, tutorial:true});
  for(const p of spots){
    if(out.length >= 22) break;
    if(out.some(l => dist(l.x, l.y, p[0], p[1]) < 70)) continue;
    const named = realm === 'forest' && (w.named || []).find(n => dist(n.p[0], n.p[1], p[0], p[1]) < 30);
    const r = Math.random(), fac = r < .3 ? null : pick(FACTIONS).id;
    const builds = fac ? ['wall', 'tower', 'barracks', 'mint'].filter(() => Math.random() < .22).slice(0, 2) : [];
    out.push({x:p[0], y:p[1], name: named ? named.name : pick(R2.lmA) + ' ' + pick(R2.lmB), owner: fac ? pick(AI_NAMES) : null, fac, ward:0, corrupted:false, builds});
  }
  // fortresses held by a realm boss; too strong for one player
  const far = out.filter(l => !l.tutorial).sort((a, b) => dist(a.x, a.y, sx, sy) - dist(b.x, b.y, sx, sy));
  [far[2], far[Math.floor(far.length*.6)]].forEach(l => { if(l){ l.boss = BOSSES[realm]; l.owner = null; l.fac = null; l.name = l.name + ' Fortress'; } });
  return out;
}
function randomPointNear(x, y, r){ const a = Math.random()*Math.PI*2, d = Math.random()*r; return [x + Math.cos(a)*d, y + Math.sin(a)*d]; }
function makeAgents(){
  const [sx, sy] = S.world.spawn, out = [];

}

/* ---------- canvas & camera ---------- */
const cv = $('#map'), ctx = cv.getContext('2d');

addEventListener('resize', resize); resize();
const toScreen = (x, y, h = 8) => S.view3d && G3 ? project3(x, y, h) : [(x - S.cam.x)*S.cam.zoom + W/2, (y - S.cam.y)*S.cam.zoom + H/2];

const grass = (() => {

const THEMES = {
  forest:  {bg:'#3c5e30', tex:grass, texScale:.3, park:'#5a8f3e', parkEdge:'rgba(30,60,25,.5)', water:'#2c6e8f', riv:['#2a5f3a','#2c6e8f','#3f93b5','rgba(190,240,255,.55)'], roadOut:'#4e3822', roadIn:'#9a774b', roadDot:'#c2a273', floor:'#1f3d22', edge:null, trees:true, flowers:true},
  cyber:   {bg:'#0b0d1c', tex:gridTex, texScale:.4, park:'#0f2a2c', parkEdge:'#1de9b6', water:'#3a0f4a', riv:['#05060f','#4a1060','#8a2be2','rgba(255,122,217,.7)'], roadOut:'#05060f', roadIn:'#1a1d3a', roadDot:'#00e5ff', floor:'#141838', edge:'#ff2bd6', trees:false, flowers:false},
  kingdom: {bg:'#7d8a45', tex:fieldTex, texScale:.3, park:'#8fae55', parkEdge:'rgba(60,80,30,.6)', water:'#3d6fa8', riv:['#5b6b3a','#3d6fa8','#5b8fc8','rgba(230,245,255,.6)'], roadOut:'#5e574b', roadIn:'#a69d8c', roadDot:'#d2cab8', floor:'#9a6b46', edge:'#4a3522', trees:false, flowers:true}
};
const pats = {};

/* ---------- rendering ---------- */
const CANOPY = ['#2e6b34','#285f2e','#357a3b','#22532a'];
function trace(pts, close){ ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); if(close) ctx.closePath(); }
function inView(bb, v, pad){ return !(bb[2] < v[0]-pad || bb[0] > v[2]+pad || bb[3] < v[1]-pad || bb[1] > v[3]+pad); }

function render(){
  const z = S.cam.zoom, w = S.world, T = THEMES[S.realm];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);
  if(!w) return;
  const [vx0, vy0] = toWorld(0, 0), [vx1, vy1] = toWorld(W, H), v = [vx0, vy0, vx1, vy1];
  ctx.setTransform(z*DPR, 0, 0, z*DPR, (W/2 - S.cam.x*z)*DPR, (H/2 - S.cam.y*z)*DPR);
  if(!pats[S.realm]){ pats[S.realm] = ctx.createPattern(T.tex, 'repeat'); pats[S.realm].setTransform(new DOMMatrix().scale(T.texScale)); }
  ctx.fillStyle = pats[S.realm]; ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
  // glades
  for(const a of w.areas) if(a.kind === 'park' && inView(a.bb, v, 10)){ trace(a.pts, true); ctx.fillStyle = T.park; ctx.fill(); ctx.strokeStyle = T.parkEdge; ctx.lineWidth = 1.5; ctx.stroke(); }
  if(T.flowers) for(const f of w.flowers) if(f.x > vx0 && f.x < vx1 && f.y > vy0 && f.y < vy1){ ctx.fillStyle = f.c; ctx.fillRect(f.x, f.y, 1.1, 1.1); }
  // water
  for(const a of w.areas) if(a.kind === 'water' && inView(a.bb, v, 10)){ trace(a.pts, true); ctx.fillStyle = T.water; ctx.fill(); }
  for(const l of w.lines) if(l.kind === 'river' && inView(l.bb, v, 30)){
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    trace(l.pts); ctx.strokeStyle = T.riv[0]; ctx.lineWidth = l.w + 6; ctx.stroke();
    ctx.strokeStyle = T.riv[1]; ctx.lineWidth = l.w; ctx.stroke();
    ctx.strokeStyle = T.riv[2]; ctx.lineWidth = l.w*.55; ctx.stroke();
    ctx.setLineDash([3, 9]); ctx.lineDashOffset = -S.t*6; ctx.strokeStyle = T.riv[3]; ctx.lineWidth = .8; ctx.stroke(); ctx.setLineDash([]);
  }
  // paths
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const roads = w.lines.filter(l => l.kind === 'road' && inView(l.bb, v, 15));
  for(const l of roads){ trace(l.pts); ctx.strokeStyle = T.roadOut; ctx.lineWidth = l.w + 2.2; ctx.stroke(); }
  for(const l of roads){ trace(l.pts); ctx.strokeStyle = T.roadIn; ctx.lineWidth = l.w; ctx.stroke(); }
  if(z > 1.2 || S.realm === 'cyber') for(const l of roads) if(l.w >= 6){ trace(l.pts); ctx.setLineDash(S.realm === 'cyber' ? [6, 5] : [.9, 4.5]); ctx.lineDashOffset = S.realm === 'cyber' ? -S.t*8 : 0; ctx.strokeStyle = T.roadDot; ctx.lineWidth = S.realm === 'cyber' ? .7 : 1.1; ctx.stroke(); ctx.setLineDash([]); }
  // building footprints: forest floor, neon towers or houses
  for(const a of w.areas) if(a.kind === 'building' && inView(a.bb, v, 8)){
    trace(a.pts, true); ctx.fillStyle = T.floor; ctx.fill();
    if(T.edge){ ctx.strokeStyle = T.edge; ctx.lineWidth = S.realm === 'cyber' ? .9 : 1.2; ctx.stroke(); }
  }
  if(!T.trees){
    if(S.realm === 'cyber' && z > 1.1){ ctx.fillStyle = 'rgba(0,229,255,.55)'; for(const a of w.areas) if(a.kind === 'building' && inView(a.bb, v, 8)){ const c = centroid(a.pts); ctx.fillRect(c[0] - 1, c[1] - 1, 2, 2); } }
    if(S.realm === 'kingdom' && z > 1.1){ ctx.strokeStyle = 'rgba(70,40,20,.5)'; ctx.lineWidth = .8; for(const a of w.areas) if(a.kind === 'building' && inView(a.bb, v, 8) && a.pts.length === 4){ const [p0, , p2] = a.pts; ctx.beginPath(); ctx.moveTo(p0[0], (p0[1] + p2[1])/2); ctx.lineTo(p2[0], (p0[1] + p2[1])/2); ctx.stroke(); } }
  }
  // trees
  if(T.trees){
  const gx0 = Math.floor(vx0/60) - 1, gx1 = Math.floor(vx1/60) + 1, gy0 = Math.floor(vy0/60) - 1, gy1 = Math.floor(vy1/60) + 1;
  const vis = [];
  for(let gx = gx0; gx <= gx1; gx++) for(let gy = gy0; gy <= gy1; gy++){ const c = w.trees.get(gx + ',' + gy); if(c) vis.push(c); }
  ctx.fillStyle = 'rgba(8,20,10,.45)';
  for(const c of vis) for(const t of c){ ctx.beginPath(); ctx.arc(t.x + 1.2, t.y + 1.4, t.r, 0, 6.283); ctx.fill(); }
  for(const c of vis) for(const t of c){ ctx.fillStyle = CANOPY[t.s]; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.283); ctx.fill(); }
  if(z > 1.1){ ctx.fillStyle = 'rgba(140,200,110,.22)'; for(const c of vis) for(const t of c){ ctx.beginPath(); ctx.arc(t.x - t.r*.3, t.y - t.r*.35, t.r*.45, 0, 6.283); ctx.fill(); } }
  }

  // encounter radius

  ctx.setLineDash([3, 3]); ctx.strokeStyle = S.mode === 'alert' && !S.vehicle ? 'rgba(255,190,80,.5)' : 'rgba(120,180,255,.5)'; ctx.lineWidth = 1/z*1.4; ctx.stroke(); ctx.setLineDash([]);
  // walk target

  for(const e of S.enemies) drawEnemy(e);

}

function drawLandmark(l){

  if(l.builds && l.builds.length && z > .9){ ctx.font = `${Math.round(clamp(z*6, 10, 16))}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; l.builds.forEach((k, i) => { const a = -2.2 + i*.9; ctx.fillText(STRUCTS[k].icon, x + Math.cos(a)*s*3.1, y + Math.sin(a)*s*3.1 + s*.6); }); }
  if(isMine(l)){ ctx.strokeStyle = l.team ? '#7be08a' : '#e8c66a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, s*2.1, 0, 6.283); ctx.stroke(); }

function label(x, y, text, col, size, bold){

function drawEnemy(e){
  const [x, y] = toScreen(e.x, e.y);
  if(x < -40 || x > W + 40 || y < -40 || y > H + 40) return;
  const b = Math.sin(S.t*3 + e.phase)*3, s = clamp(S.cam.zoom*4, 8, 13);

  for(let i = 0; i < 3; i++) ctx.lineTo(x + s - (i + .5)*s*2/3, y + b + s*(i % 2 ? .4 : 1.1));

function drawReach(){
  const p = S.player, [rx, ry] = toScreen(p.rx, p.ry), r = reachFor(p.rank)*S.cam.zoom;
  // dim everything outside the reachable area
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.moveTo(rx + r, ry); ctx.arc(rx, ry, r, 0, 6.283, true);
  ctx.fillStyle = 'rgba(5,10,25,.5)'; ctx.fill('evenodd');

  ctx.beginPath(); ctx.arc(rx, ry, r, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);

  if(p.linked) return;

  ctx.strokeStyle = 'rgba(120,190,255,.6)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(vx, vy); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(60,140,255,.25)'; ctx.beginPath(); ctx.arc(rx, ry, 14, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#3c8cff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(rx, ry, 6, 0, 6.283); ctx.fill(); ctx.stroke();

}
function drawPlayer(){
  const p = S.player, [x, y] = toScreen(p.x, p.y), col = FAC(p.fac).color;

function signupWorld(){
  const framed = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
  scr.innerHTML = `<div class="signup"><div class="logo" style="font-size:28px">Enter the Forest Realm</div>

    <div id="msgBtns" class="row" style="display:none"><button id="retry">Try again</button><button id="useDemo">Use demo village</button></div></div>`;

  const go = () => {
    btns.style.display = 'none'; $('#real').disabled = true;
    if(!window.isSecureContext) return fail('⚠️ Location only works on a secure (https) page.');
    if(!navigator.geolocation) return fail('⚠️ This browser does not offer location.');
    msg.textContent = '📍 Asking for your location… (allow it in the browser prompt)';
    const gotPos = async pos => {
      const {latitude:lat, longitude:lon, accuracy} = pos.coords;
      msg.textContent = `📍 Found you (±${Math.round(accuracy)} m). Loading your streets…`;
      try{
        const w = await genOsmWorld(lat, lon, lat, lon, t => msg.textContent = t);
        if(w.lines.filter(l => l.kind === 'road').length < 3) return fail('⚠️ The map server returned almost no streets for this spot. Try again in a minute, or use the demo village.');

    };

      if(err.code === 1) return fail('⚠️ Location permission was denied. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → "While Using". On Android: tap the lock icon in the address bar → Permissions → Location. Then try again.');

    };
    navigator.geolocation.getCurrentPosition(gotPos, e => posErr(e, false), {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
  };
  $('#real').onclick = go; $('#retry').onclick = go;
}

function startGpsWatch(){
  let last = null;
  navigator.geolocation.watchPosition(pos => {
    const {lat0, lon0} = S.gps, k = Math.cos(lat0*Math.PI/180)*111320;
    const x = (pos.coords.longitude - lon0)*k, y = -(pos.coords.latitude - lat0)*110540;
    const now = performance.now()/1000;
    if(last){ const sp = dist(x, y, last.x, last.y)/Math.max(.5, now - last.t); S.player.speedSamples.push([now, pos.coords.speed ?? sp]); }
    last = {x, y, t:now};
    S.gps.lat = pos.coords.latitude; S.gps.lon = pos.coords.longitude;
    S.player.rx = x; S.player.ry = y;
    if(S.player.linked){ S.player.tx = x; S.player.ty = y; }
  }, () => {}, {enableHighAccuracy:true});
}

function startQuest(){ const q = QUESTS[S.qi]; if(q && q.start) q.start(); renderQuest(); }

function fightTeammate(l, name, theyAsked){

  duel.innerHTML = `<div class="dhead"><span>${esc(o.title)}</span><span>${w.icon} ${w.name}</span></div><canvas id="bat" style="flex:1;width:100%;touch-action:none;border-radius:16px;margin-top:10px"></canvas>
    <p class="center note" style="margin:8px 0 0">Tap the enemy to shoot · tap incoming orbs to destroy them</p>`;
  const c = $('#bat'), g = c.getContext('2d');
  const box = c.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2.5), BW = box.width, BH = box.height;
  c.width = BW*dpr; c.height = BH*dpr; g.scale(dpr, dpr);
  const maxHp = Math.round(80 + o.armor*2.2);
  const E = {x:BW/2, y:BH*.3, r:o.boss ? 46 : 32, hp:maxHp}, inDmg = Math.round(6 + o.armor/10);
  let me = 100, t = 45, cd = 0, atk = 1.5, tt = 0, over = false, hurt = 0;
  const orbs = [], tracers = [], floats = [], allyCd = allies.map(() => .5 + Math.random());
  const bg = THEMES[S.realm].bg;
  c.onpointerdown = ev => {
    if(over) return;
    const r = c.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    const orb = orbs.find(b => dist(b.x, b.y, x, y) < 30);
    if(orb){ orbs.splice(orbs.indexOf(orb), 1); floats.push({x, y, txt:'blocked', c:'#9fe8ff', t:0}); tracers.push({x0:BW/2, y0:BH - 20, x1:x, y1:y, t:0, c:'#9fe8ff'}); return; }
    if(cd > 0) return;
    cd = w.rate; tracers.push({x0:BW/2, y0:BH - 20, x1:x, y1:y, t:0, c:'#ffe28a'});
    if(dist(x, y, E.x, E.y) < E.r + 16){ const dmg = Math.max(1, Math.round(w.power*mult*(.85 + Math.random()*.3))); E.hp -= dmg; floats.push({x, y:y - 10, txt:'-' + dmg, c:'#ffe28a', t:0}); }
    else floats.push({x, y, txt:'miss', c:'#aaa', t:0});
  };
  let lastT = performance.now();
  const frame = now => {
    if(!c.isConnected || over) return;
    const dt = Math.min(.05, (now - lastT)/1000); lastT = now; tt += dt; t -= dt; cd -= dt; hurt = Math.max(0, hurt - dt);
    E.x = BW/2 + Math.sin(tt*.9)*BW*.32; E.y = BH*.28 + Math.sin(tt*1.7)*BH*.1;
    atk -= dt;
    if(atk <= 0){ atk = Math.max(.6, 2.2 - o.armor/110) * (.8 + Math.random()*.4); const tx = 30 + Math.random()*(BW - 60); orbs.push({x:E.x, y:E.y, vx:(tx - E.x)/1.9, vy:(BH - 10 - E.y)/1.9}); }
    for(let i = orbs.length - 1; i >= 0; i--){ const b = orbs[i]; b.x += b.vx*dt; b.y += b.vy*dt; if(b.y > BH - 22){ orbs.splice(i, 1); me -= inDmg; hurt = .25; floats.push({x:b.x, y:BH - 40, txt:'-' + inDmg, c:'#ff7b7b', t:0}); } }
    allies.forEach((a, i) => { allyCd[i] -= dt; if(allyCd[i] <= 0){ allyCd[i] = .9 + Math.random()*.5; const sx = 30 + (i + 1)*(BW - 60)/(allies.length + 1), dmg = Math.max(1, Math.round(a.power*mult*.8)); E.hp -= dmg; tracers.push({x0:sx, y0:BH - 14, x1:E.x, y1:E.y, t:0, c:'#7be08a'}); floats.push({x:E.x + 20, y:E.y - 20, txt:'-' + dmg, c:'#7be08a', t:0}); } });
    // draw
    g.fillStyle = bg; g.fillRect(0, 0, BW, BH);
    const grd = g.createRadialGradient(BW/2, BH*.3, 10, BW/2, BH*.3, BH); grd.addColorStop(0, 'rgba(255,255,255,.08)'); grd.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = grd; g.fillRect(0, 0, BW, BH);
    // enemy
    const er = E.r*(1 + Math.sin(tt*6)*.04), ec = o.boss ? '#c62828' : o.foeFac ? FAC(o.foeFac).color : '#7b2cbf';
    const eg = g.createRadialGradient(E.x, E.y, 2, E.x, E.y, er*2); eg.addColorStop(0, hexA(ec.length === 7 ? ec : '#7b2cbf', .55)); eg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = eg; g.beginPath(); g.arc(E.x, E.y, er*2, 0, 6.283); g.fill();
    g.fillStyle = '#140a1c'; g.beginPath(); g.arc(E.x, E.y, er, 0, 6.283); g.fill(); g.strokeStyle = ec; g.lineWidth = 3; g.stroke();
    if(o.boss){ g.fillStyle = '#ffd34d'; g.beginPath(); g.moveTo(E.x - er*.6, E.y - er*.85); g.lineTo(E.x - er*.35, E.y - er*1.35); g.lineTo(E.x, E.y - er*.95); g.lineTo(E.x + er*.35, E.y - er*1.35); g.lineTo(E.x + er*.6, E.y - er*.85); g.fill(); }
    g.fillStyle = '#ff5c8a'; g.beginPath(); g.arc(E.x - er*.35, E.y - er*.15, er*.13, 0, 6.283); g.arc(E.x + er*.35, E.y - er*.15, er*.13, 0, 6.283); g.fill();
    // orbs
    for(const b of orbs){ const og = g.createRadialGradient(b.x, b.y, 1, b.x, b.y, 16); og.addColorStop(0, '#ffb4f0'); og.addColorStop(.5, '#c03ad8'); og.addColorStop(1, 'rgba(120,0,140,0)'); g.fillStyle = og; g.beginPath(); g.arc(b.x, b.y, 16, 0, 6.283); g.fill(); }
    // tracers
    for(let i = tracers.length - 1; i >= 0; i--){ const r = tracers[i]; r.t += dt; if(r.t > .14){ tracers.splice(i, 1); continue; } g.strokeStyle = r.c; g.globalAlpha = 1 - r.t/.14; g.lineWidth = 3; g.beginPath(); g.moveTo(r.x0, r.y0); g.lineTo(r.x1, r.y1); g.stroke(); g.globalAlpha = 1; }
    // floaters
    g.font = '700 15px Inter, sans-serif'; g.textAlign = 'center';
    for(let i = floats.length - 1; i >= 0; i--){ const f = floats[i]; f.t += dt; if(f.t > .8){ floats.splice(i, 1); continue; } g.globalAlpha = 1 - f.t/.8; g.fillStyle = f.c; g.fillText(f.txt, f.x, f.y - f.t*40); g.globalAlpha = 1; }
    // allies + player
    allies.forEach((a, i) => { const sx = 30 + (i + 1)*(BW - 60)/(allies.length + 1); g.fillStyle = '#7be08a'; g.beginPath(); g.arc(sx, BH - 12, 6, 0, 6.283); g.fill(); g.font = '600 10px Inter'; g.fillStyle = '#cfe8d3'; g.fillText(a.name, sx, BH - 24); });
    g.fillStyle = FAC(S.player.fac).color; g.beginPath(); g.arc(BW/2, BH - 14, 10, 0, 6.283); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
    // bars
    const bar = (x, y, wd, v, col, txt) => { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x, y, wd, 10); g.fillStyle = col; g.fillRect(x, y, wd*clamp(v, 0, 1), 10); g.font = '600 11px Inter'; g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText(txt, x, y - 4); g.textAlign = 'center'; };
    bar(12, 22, BW - 24, E.hp/maxHp, ec, `${o.foe} · ${Math.max(0, Math.ceil(E.hp))}/${maxHp}`);
    bar(12, BH - 58, BW*.45, me/100, '#7be08a', `You · ${Math.max(0, me)}`);
    g.font = '700 14px Inter'; g.textAlign = 'right'; g.fillStyle = t < 10 ? '#ff8a8a' : '#fff'; g.fillText(Math.ceil(t) + 's', BW - 12, BH - 48); g.textAlign = 'center';
    if(cd > 0){ g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(BW/2 - 20, BH - 34, 40*(cd/w.rate), 3); }
    if(hurt > 0){ g.fillStyle = `rgba(255,0,0,${hurt})`; g.fillRect(0, 0, BW, BH); }
    if(E.hp <= 0 || me <= 0 || t <= 0){
      over = true; const won = E.hp <= 0;
      return setTimeout(() => duelResult(o, won, won ? (allies.length ? `Your team of ${allies.length + 1} brought down ${esc(o.foe)}.` : `You brought down ${esc(o.foe)}.`) : me <= 0 ? 'You were overwhelmed. More force or allies would help.' : 'Time ran out. More force would finish it faster.'), 500);
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function nearestAgent(){

  for(const a of S.agents){ const d = pdist(a); if(d < bd && d <= RANGE && !(S.cooldowns.get(a.id) > S.t)){ best = a; bd = d; } }
  return best;
}
function renderBanner(){

/* ---------- duel engine ---------- */
const duel = $('#duel');
function startDuel(o){
  S.busy = true; duel.style.display = 'flex';
  const feat = REALMS[S.realm].featured;
  const game = Math.random() < .5 ? GAMES.find(g => g.id === feat) : pick(GAMES); o.game = game;
  const foeCol = o.foeFac ? FAC(o.foeFac).color : (o.enemy ? '#c27bff' : '#e8e2c8');
  const diffWord = ['Novice','Skilled','Master'][o.diff];
  duel.innerHTML = `<div class="dhead"><span>${esc(o.title)}</span><span>${diffWord} opponent</span></div>
    <div class="arena" style="justify-content:center">
      <div class="center" style="font-size:13px;color:var(--quiet)">You face</div>
      <div class="big" style="color:${foeCol}">${esc(o.foe)}</div>
      ${o.foeFac ? `<div class="center" style="color:var(--quiet)">${FAC(o.foeFac).name}</div>` : ''}
      <div class="card" style="margin:22px 0 8px"><span style="font-size:30px" id="gIcon">${game.icon}</span><div class="tx"><b id="gName">${game.name}</b><br><span style="color:var(--quiet)" id="gDesc">${game.desc}</span></div></div>
      <p class="center" style="color:var(--quiet);font-size:13px">${esc(o.stakes)}</p>
      <div class="stack"><button class="primary" id="go">Start duel</button><button id="reroll">🎲 Re-roll game (10 🪙)</button><button id="flee">Walk away</button></div>
    </div>`;
  $('#reroll').onclick = () => {
    if(S.player.coins < 10) return toast('Not enough coins.', 'bad');
    S.player.coins -= 10; updateHud();
    let g; do g = pick(GAMES); while(g === o.game); o.game = g;
    $('#gIcon').textContent = g.icon; $('#gName').textContent = g.name; $('#gDesc').textContent = g.desc;
    $('#reroll').disabled = true;
  };
  $('#flee').onclick = () => endDuel();
  $('#go').onclick = () => ({quiz:gameQuiz, runes:gameRunes, memory:gameMemory})[o.game.id](o);
}
function endDuel(){ duel.style.display = 'none'; duel.innerHTML = ''; S.busy = !!overlay; }
function duelResult(o, won, detail){
  duel.innerHTML = `<div class="arena"><div class="big" style="font-size:44px">${won ? 'Victory' : 'Defeat'}</div>
    <p class="center" style="color:var(--quiet)">${detail}</p><div class="stack" style="margin-top:24px"><button class="primary" id="done">Back to the realm</button></div></div>`;
  $('#done').onclick = () => { endDuel(); won ? o.win(o.team) : o.lose(); };
}
function scoreboard(o, a, b){
  return `<div class="vs"><div class="fighter"><div class="nm" style="color:${FAC(S.player.fac).color}">${esc(S.player.name)}</div><div class="sc" id="sa">${a}</div></div><div class="vsx">vs</div><div class="fighter"><div class="nm">${esc(o.foe)}</div><div class="sc" id="sb">${b}</div></div></div>`;
}
function gameQuiz(o){
  const qs = [...QUIZ].sort(() => Math.random() - .5);
  let i = 0, me = 0, foe = 0, round = 0;
  const pAI = [.45, .62, .78][o.diff];
  function next(){
    if(duel.style.display !== 'flex') return;
    round++;
    if(round > 3 && me !== foe || round > 5){
      return duelResult(o, me > foe || (me === foe && !!o.youDefend), `You answered ${me}, ${esc(o.foe)} answered ${foe}.${me === foe ? ' Ties go to the defender' + (o.youDefend ? ' — that\'s you.' : '.') : ''}`);
    }
    const [q, opts, ans] = qs[i++]; const order = opts.map((t, k) => ({t, k})).sort(() => Math.random() - .5);
    duel.innerHTML = `<div class="dhead"><span>${o.game.name} · ${round > 3 ? 'Sudden death' : 'Question ' + round + ' of 3'}</span><span>${esc(o.title)}</span></div>${scoreboard(o, me, foe)}
      <div class="arena"><div class="timer"><i id="bar"></i></div><div class="qtext">${esc(q)}</div><div class="opts">${order.map(x => `<button class="opt" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div><div class="ai-note" id="ain"></div></div>`;
    const aiRight = Math.random() < pAI, aiPick = aiRight ? ans : pick([0, 1, 2, 3].filter(k => k !== ans));
    const aiAt = 1.5 + Math.random()*5; let t0 = performance.now(), done = false, aiDone = false;
    const tick = () => {
      if(done || !$('#bar')) return; const el = (performance.now() - t0)/1000;
      $('#bar').style.width = Math.max(0, 100 - el/8*100) + '%';
      if(!aiDone && el > aiAt){ aiDone = true; $('#ain').textContent = `${o.foe} has answered…`; }
      if(el >= 8) return finish(null); requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    duel.querySelectorAll('.opt').forEach(b => b.onclick = () => finish(+b.dataset.k));
    function finish(k){
      if(done || !$('#sa')) return; done = true;
      duel.querySelectorAll('.opt').forEach(b => { const kk = +b.dataset.k; if(kk === ans) b.classList.add('right'); else if(kk === k) b.classList.add('wrong'); b.disabled = true; });
      if(k === ans) me++; if(aiRight) foe++;
      $('#sa').textContent = me; $('#sb').textContent = foe;
      $('#ain').textContent = `${o.foe} picked “${opts[aiPick]}” ${aiRight ? '✓' : '✗'}`;
      setTimeout(next, 1700);
    }
  }
  next();
}
function gameRunes(o){
  const total = 8, life = [1250, 1050, 880][o.diff];
  const foe = clamp(Math.round(3.5 + o.diff*1.3 + Math.random()*1.6), 2, 8);
  let n = 0, hits = 0;
  duel.innerHTML = `<div class="dhead"><span>${o.game.name}</span><span>Target to beat: ${foe} of ${total}</span></div>${scoreboard(o, 0, foe)}<div class="arena" id="ar"><div class="center" style="color:var(--quiet)" id="cnt">Get ready…</div></div>`;
  const ar = $('#ar'); let cur = null, tm = null;
  const spawn = () => {
    if(!ar.isConnected) return;
    if(cur) cur.remove();
    if(n >= total) return setTimeout(() => duelResult(o, hits > foe || (hits === foe && !!o.youDefend), `You struck ${hits} of ${total} runes. ${esc(o.foe)} struck ${foe}.${hits === foe ? ' Ties go to the defender' + (o.youDefend ? ' — that\'s you.' : '.') : ''}`), 400);
    n++; $('#cnt').textContent = `Rune ${n} of ${total}`;
    const r = ar.getBoundingClientRect(); cur = document.createElement('div'); cur.className = 'rune';
    cur.textContent = pick(['ᚠ','ᚱ','ᛟ','ᛉ','ᚦ','ᛗ']);
    cur.style.left = (10 + Math.random()*(r.width - 84)) + 'px'; cur.style.top = (40 + Math.random()*(r.height - 120)) + 'px';
    cur.onpointerdown = () => { hits++; $('#sa').textContent = hits; clearTimeout(tm); cur.remove(); cur = null; setTimeout(spawn, 260 + Math.random()*500); };
    ar.appendChild(cur);
    tm = setTimeout(() => { if(cur){ cur.remove(); cur = null; } setTimeout(spawn, 200); }, life);
  };
  setTimeout(spawn, 1200);
}
function gameMemory(o){
  const glyph = ['🍃','🔥','💧','🌙'], len = 4 + o.diff;
  const seq = Array.from({length:len}, () => Math.floor(Math.random()*4));
  duel.innerHTML = `<div class="dhead"><span>${o.game.name}</span><span>Sequence of ${len}</span></div><div class="arena"><p class="center" id="st" style="color:var(--quiet);margin-bottom:18px">Watch the spirits…</p>
    <div class="mem">${glyph.map((g, k) => `<button data-k="${k}" disabled>${g}</button>`).join('')}</div></div>`;
  const btns = [...duel.querySelectorAll('.mem button')];
  let i = 0;
  const show = () => {
    if(!btns[0].isConnected) return;
    if(i >= seq.length){ btns.forEach(b => b.disabled = false); $('#st').textContent = 'Now repeat it!'; return; }
    const b = btns[seq[i]]; b.classList.add('lit');
    setTimeout(() => { b.classList.remove('lit'); i++; setTimeout(show, 220); }, 520 - o.diff*80);
  };
  setTimeout(show, 900);
  let pos = 0;
  btns.forEach(b => b.onclick = () => {
    const k = +b.dataset.k; b.classList.add('lit'); setTimeout(() => b.classList.remove('lit'), 160);
    if(k !== seq[pos]){ btns.forEach(x => x.disabled = true); return setTimeout(() => duelResult(o, false, `The echo broke at step ${pos + 1} of ${len}.`), 500); }
    pos++; $('#st').textContent = `${pos} of ${len}`;
    if(pos === len){ btns.forEach(x => x.disabled = true); setTimeout(() => duelResult(o, true, `You repeated all ${len} steps.`), 500); }
  });
}

/* ---------- menus ---------- */

function makeCode(realm){ const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for(let i = 0; i < 4; i++) s += c[Math.floor(Math.random()*c.length)]; return realm.toUpperCase() + '-' + s; }
function enterRealm(k){

  if(k === S.realm) return;
  if(S.portalCD > 0) return toast(`The portal is recharging (${Math.ceil(S.portalCD)} s).`);
  const r = S.realms[k]; if(!r.unlocked) return;
  if(!r.landmarks) r.landmarks = makeLandmarks(S.world, k);
  S.realm = k; S.landmarks = r.landmarks; S.enemies = [makeEnemy(), makeEnemy(), makeEnemy()];
  S.portalCD = 30; S.cooldowns.clear();
  if(S.raid) notify(`The raid on ${S.raid.lm.name} continues in the realm you left.`, 'bad');
  updateHud(); closeSheet();
  notify(`${REALMS[k].icon} You stepped through the portal into the ${REALMS[k].name}. ${REALMS[k].blurb}`, 'gold');
}
function acceptInvite(inv){
  S.invites = S.invites.filter(i => i !== inv);
  S.realms[inv.realm].unlocked = true; S.player.rank += 5; updateHud();
  notify(`📨 Invitation accepted. ${inv.from} welcomed you to the ${REALMS[inv.realm].name}.`, 'gold');
  enterRealm(inv.realm);
}

/* ---------- 3D view (three.js, loaded on demand) ---------- */
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let T3 = null, G3 = null;
async function toggle3D(){

  if(!T3){ toast('Loading 3D view…'); try{ T3 = await import(THREE_URL); }catch(e){ return toast('The 3D view could not load here.', 'bad'); } }
  try{ if(!G3) init3D(); }catch(e){ console.error(e); return toast('3D is not supported on this device.', 'bad'); }
  S.view3d = true; G3.dirty = true; G3.canvas.style.display = 'block'; $('#viewBtn').textContent = '2D';

$('#viewBtn').onclick = toggle3D;
function init3D(){

  document.body.insertBefore(c, cv);
  const renderer = new THREE.WebGLRenderer({canvas:c, antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(W, H, false);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x445544, 1.1), sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(-200, 400, 150); scene.add(hemi, sun);
  const world = new THREE.Group(), dyn = new THREE.Group(); scene.add(world, dyn);
  G3 = {canvas:c, renderer, scene, camera, hemi, world, dyn, yaw:.5, pitch:.9, dirty:true, lm:new Map(), en:new Map(), ray:new THREE.Raycaster(), v:new THREE.Vector3(), plane:new THREE.Plane(new THREE.Vector3(0, 1, 0), 0),
    geo:{base:new THREE.CylinderGeometry(3, 3.8, 1.2, 10), pillar:new THREE.BoxGeometry(1.8, 7, 1.8), orb:new THREE.SphereGeometry(1.5, 14, 10), ring:new THREE.TorusGeometry(6, .35, 6, 32), ward:new THREE.TorusGeometry(8.5, .25, 6, 40), en:new THREE.SphereGeometry(2.6, 12, 10), eye:new THREE.SphereGeometry(.45, 8, 6)}};

}
function disposeGroup(g){ const shared = G3 ? Object.values(G3.geo) : []; g.traverse(o => { if(o.geometry && !shared.includes(o.geometry)) o.geometry.dispose(); if(o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); }); g.clear(); }
const openPts = pts => (pts.length > 2 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) ? pts.slice(0, -1) : pts;
function ribbonGeo(lines, y, widthScale = 1){
  const THREE = T3, pos = [], idx = [];
  for(const l of lines){
    const h = l.w*widthScale/2;
    for(let i = 0; i < l.pts.length - 1; i++){
      const [x0, z0] = l.pts[i], [x1, z1] = l.pts[i + 1], len = Math.hypot(x1 - x0, z1 - z0); if(len < .01) continue;
      const dx = (x1 - x0)/len, dz = (z1 - z0)/len, nx = -dz*h, nz = dx*h, ex = dx*h*.5, ez = dz*h*.5, b = pos.length/3;
      pos.push(x0 - ex + nx, y, z0 - ez + nz, x0 - ex - nx, y, z0 - ez - nz, x1 + ex + nx, y, z1 + ez + nz, x1 + ex - nx, y, z1 + ez - nz);
      idx.push(b, b + 2, b + 1, b + 1, b + 2, b + 3);
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
function flatGeo(areas, y){
  const THREE = T3, pos = [];
  for(const a of areas){
    const pts = openPts(a.pts); if(pts.length < 3) continue;
    const tris = THREE.ShapeUtils.triangulateShape(pts.map(p => new THREE.Vector2(p[0], p[1])), []);
    for(const t of tris) for(const k of t) pos.push(pts[k][0], y, pts[k][1]);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
}
function prismGeo(areas, heightOf, wallCol, roofCol){
  const THREE = T3, pos = [], col = [], wc = new THREE.Color(wallCol), rc = new THREE.Color(roofCol);
  areas.forEach((a, n) => {
    const pts = openPts(a.pts); if(pts.length < 3) return;
    const h = heightOf(n, a);
    for(let i = 0; i < pts.length; i++){
      const [x0, z0] = pts[i], [x1, z1] = pts[(i + 1) % pts.length], shade = .75 + .25*Math.abs(Math.sin(Math.atan2(z1 - z0, x1 - x0)));

      for(let k = 0; k < 6; k++) col.push(wc.r*shade, wc.g*shade, wc.b*shade);
    }
    const tris = THREE.ShapeUtils.triangulateShape(pts.map(p => new THREE.Vector2(p[0], p[1])), []);
    for(const t of tris) for(const k of t){ pos.push(pts[k][0], h, pts[k][1]); col.push(rc.r, rc.g, rc.b); }
  });

}
function outlineGeo(areas, heightOf){
  const THREE = T3, pos = [];
  areas.forEach((a, n) => { const pts = openPts(a.pts), h = heightOf(n, a) + .05; for(let i = 0; i < pts.length; i++){ const p = pts[i], q = pts[(i + 1) % pts.length]; pos.push(p[0], h, p[1], q[0], h, q[1]); } });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); return g;
}
const hash01 = n => { const x = Math.sin(n*127.1 + 311.7)*43758.5453; return x - Math.floor(x); };
function build3D(){
  const THREE = T3, w = S.world, T = THEMES[S.realm], g = G3.world;
  disposeGroup(g); disposeGroup(G3.dyn); G3.lm.clear(); G3.en.clear(); G3.player = null;
  const lam = (c, extra = {}) => new THREE.MeshLambertMaterial({color:c, side:THREE.DoubleSide, ...extra});
  G3.scene.background = new THREE.Color(T.bg);
  G3.scene.fog = new THREE.Fog(T.bg, 250, 900);
  G3.hemi.intensity = S.realm === 'cyber' ? .7 : 1.1;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), lam(T.bg)); ground.rotation.x = -Math.PI/2; g.add(ground);
  const parks = w.areas.filter(a => a.kind === 'park'), water = w.areas.filter(a => a.kind === 'water'), blds = w.areas.filter(a => a.kind === 'building');

function buildMeshes(l, r){
  const THREE = T3;

    const lam = c => new THREE.MeshLambertMaterial({color:c});
    if(k === 'tower'){ const t = new THREE.Mesh(new THREE.BoxGeometry(1.4, 7, 1.4), lam('#9a8f7a')); t.position.y = 3.5; const roof = new THREE.Mesh(new THREE.ConeGeometry(1.4, 2, 4), lam('#7a3b2a')); roof.position.y = 8; g.add(t, roof); }
    if(k === 'mint'){ const m = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 2, 12), lam('#e8c66a')); m.position.y = 1; g.add(m); }
    if(k === 'wall'){ g.position.set(0, 0, 0); const w = new THREE.Mesh(new THREE.TorusGeometry(10.5, .7, 4, 28), lam('#8d8577')); w.rotation.x = Math.PI/2; w.position.y = .7; g.add(w); }

    bg.add(g);

let last = performance.now(), slow = 0, vehicleExit = 0;
function update(dt){

    const d = dist(p.x, p.y, p.tx, p.ty), sp = S.worldKind === 'osm' && p.linked ? Math.max(d*2, 2) : 11;

  }
  if(S.worldKind === 'osm'){
    if(S.vehicle && !p.linked){ p.linked = true; p.returning = false; p.x = p.rx; p.y = p.ry; p.tx = p.ty = null; $('#homeBtn').style.display = 'none'; }
    if(!p.linked){
      const reach = reachFor(p.rank), d = dist(p.x, p.y, p.rx, p.ry);
      if(d > reach){ const k = reach/d; p.x = p.rx + (p.x - p.rx)*k; p.y = p.ry + (p.y - p.ry)*k; }
      if(p.returning){ p.tx = p.rx; p.ty = p.ry; if(d < 2){ p.linked = true; p.returning = false; p.tx = p.ty = null; $('#homeBtn').style.display = 'none'; } }

  const now = performance.now()/1000;
  p.speedSamples = p.speedSamples.filter(s => now - s[0] < 20);
  const fast = p.speedSamples.length >= 3 && p.speedSamples.every(s => s[1] > 7);

  if(S.simDriving || fast){ S.vehicle = true; vehicleExit = 0; }

  if(S.vehicle !== wasVehicle){

    if(!S.vehicle){ toast('On foot again — the realm is awake.', 'good'); S.heldNotices.splice(0).slice(-3).forEach(([m, k]) => toast(m, k)); }
    else if(duel.style.display === 'flex'){ endDuel(); toast('Duel paused: vehicle detected. Your stakes are protected.'); }
  }
  if(S.modeCooldown > 0){ S.modeCooldown -= dt; if(S.modeCooldown <= 0){ S.mode = 'alert'; notify('⚡ You are alert. Rivals can challenge you.'); } updateHud(); }
  // agents
  for(const a of S.agents){
    if(dist(a.x, a.y, a.tx, a.ty) < 2){ [a.tx, a.ty] = Math.random() < .35 ? randomPointNear(p.x, p.y, 120) : randomPointNear(p.rx, p.ry, 420); if(Math.random() < .2) a.mode = a.mode === 'alert' ? 'shield' : 'alert'; }
    const d = dist(a.x, a.y, a.tx, a.ty), k = Math.min(1, a.speed*dt/d); a.x += (a.tx - a.x)*k; a.y += (a.ty - a.y)*k;
  }
  for(const e of S.enemies){
    if(dist(e.x, e.y, e.tx, e.ty) < 2) [e.tx, e.ty] = randomPointNear(e.x, e.y, 80);
    const d = dist(e.x, e.y, e.tx, e.ty), k = Math.min(1, 1.2*dt/d); e.x += (e.tx - e.x)*k; e.y += (e.ty - e.y)*k;
  }
  // wards
  for(const l of S.landmarks) if(l.ward > 0) l.ward = Math.max(0, l.ward - dt);
  // income
  S.incomeT += dt;
  if(S.incomeT >= 10){ S.incomeT = 0; const n = S.landmarks.reduce((t, l) => t + myShare(l)*((l.fortress ? 3 : 1) + (has(l, 'mint') ? 1 : 0) + prestigeBonus(l)), 0); p.carry = (p.carry || 0) + n; if(p.carry >= 1){ p.coins += Math.floor(p.carry); p.carry -= Math.floor(p.carry); updateHud(); } }
  // AI factions shift the map
  S.aiT += dt;
  if(S.aiT > 25){ S.aiT = 0; const cand = S.landmarks.filter(l => !isMine(l) && !l.tutorial && !l.boss && !(l.ward > 0) && pdist(l) > 80); if(cand.length){ const l = pick(cand); const f = pick(FACTIONS); if(l.corrupted && Math.random() < .5){ l.corrupted = false; } l.fac = f.id; l.owner = pick(AI_NAMES); } }
  // AI challenges
  if(!S.busy && S.mode === 'alert' && !S.vehicle){
    S.challengeT -= dt;
    if(S.challengeT <= 0){ S.challengeT = 25 + Math.random()*20; const a = nearestAgent(); if(a && a.fac !== p.fac && a.mode === 'alert' && Math.random() < .55) incomingChallenge(a); }
  }
  // AI teammates sometimes ask to fight you for your share
  S.mateT = (S.mateT ?? 70) - dt;
  if(S.mateT <= 0 && !S.busy && !S.vehicle){
    S.mateT = 80 + Math.random()*40;
    const tl = S.landmarks.find(l => isMine(l) && l.team && l.team.length > 1);
    if(tl){
      const mate = pick(tl.team.filter(m => m.name !== p.name)); let t = 30;
      const sh = sheet(`<h2>⚔️ Team challenge</h2><p><b>${esc(mate.name)}</b> asks to fight you for your share of <b>${esc(tl.name)}</b>.</p>
        <div class="kv"><span>Stakes</span><span>both stake the smaller share</span></div><div class="kv"><span>Respond within</span><span id="cd2">30 s</span></div>
        <div class="row"><button data-a="no">Decline</button><button class="primary" data-a="yes">Accept</button></div>`);
      const iv = setInterval(() => { t--; const c = sh.querySelector('#cd2'); if(c) c.textContent = t + ' s'; if(t <= 0){ clearInterval(iv); closeSheet(); } }, 1000);
      sh.onclick = e => { const a = e.target.closest('button')?.dataset.a; if(!a) return; clearInterval(iv); closeSheet(); if(a === 'yes') fightTeammate(tl, mate.name, true); else notify('You declined. Your share stays yours.'); };
    }
  }
  // raids
  const owned = S.landmarks.filter(isMine);
  if(!S.raid && owned.length){ S.nextRaidIn -= dt; if(S.nextRaidIn <= 0){ const lm = pick(owned), t = 60 + (has(lm, 'tower') ? 30 : 0); S.raid = {lm, t}; notify(`⚠ Raiders will strike ${lm.name} in ${t} s!${has(lm, 'tower') ? ' (Watchtower: +30 s warning)' : ''} Ward it or defend it.`, 'bad'); } }
  if(S.raid){ S.raid.t -= dt; if(!isMine(S.raid.lm)){ S.raid = null; } else if(S.raid.t <= 0) resolveRaid(); }
  // realm portal cooldown and invitations from players already inside other realms
  if(S.portalCD > 0) S.portalCD -= dt;
  if(!S.busy && !S.vehicle){
    S.inviteT -= dt;
    if(S.inviteT <= 0){
      S.inviteT = 45;
      const want = !S.realms.cyber.unlocked ? 'cyber' : (!S.realms.kingdom.unlocked && p.rank >= 40 ? 'kingdom' : null);
      if(want && !S.invites.some(i => i.realm === want)){
        const a = pick(S.agents), inv = {from:a.name, fac:a.fac, realm:want};
        S.invites.push(inv);
        notify(`📨 ${a.name}, already in the ${REALMS[want].name}, invited you to join. Open ${REALMS[S.realm].icon} Realm to accept.`, 'gold');
      }
    }
  }
  slow += dt; if(slow > .4){ slow = 0; renderBanner(); renderRaidbar(); checkQuest(); }
}
function loop(t){ const dt = Math.min(.05, (t - last)/1000); last = t; try{ update(dt); if(S.view3d && G3) render3D(); else render(); }catch(e){ console.error(e); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
signupStart();
</script>
